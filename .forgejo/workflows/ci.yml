# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
# Runs on merge to the default branch, plus a build on Renovate PRs. The PR
# trigger exists only so the merge bot (deploy/renovate-automerge.py) can land
# a dependency update after it compiles instead of waiting for a human. Every
# other PR is skipped by the job condition below: feature branches are covered
# by the local workflow and PR-Agent, and building them here would multiply
# runner load without proving anything new.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · parse
    if: forgejo.event_name != 'pull_request' || startsWith(forgejo.event.pull_request.head.ref, 'renovate/')
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: parse json
        run: |
          python3 - <<'PY'
          import glob, json, sys
          skip = {"node_modules", "vendor", "dist", "build", "target", "archive", ".archive"}
          bad = 0
          files = [p for p in glob.glob("**/*.json", recursive=True)
                   if not any(part in skip or part.startswith(".") for part in p.split("/")[:-1])]
          for path in files:
              try:
                  with open(path) as fh:
                      json.load(fh)
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  bad += 1
          print(f"checked {len(files)} json files")
          sys.exit(1 if bad else 0)
          PY
      - name: parse yaml
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml \
            || python3 -m pip install --quiet pyyaml || true
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              # Never let a missing parser become a permanent red gate: the
              # data is still checked by the JSON and shell steps.
              print("pyyaml unavailable; skipping yaml parse")
              sys.exit(0)
          skip = {"node_modules", "vendor", "dist", "build", "target", "archive", ".archive"}
          bad = 0
          files = [p for p in glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True)
                   if not any(part in skip or part.startswith(".") for part in p.split("/")[:-1])]
          for path in files:
              try:
                  with open(path) as fh:
                      yaml.safe_load(fh)
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  bad += 1
          print(f"checked {len(files)} yaml files")
          sys.exit(1 if bad else 0)
          PY

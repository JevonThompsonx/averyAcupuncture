# nginx server config for the Avery Acupuncture static site.
# Serves on 8080 (published to host loopback 127.0.0.1:8100 by compose —
# the tunnel connector reaches it as localhost:8100).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Liveness probe (also used by the Docker HEALTHCHECK).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Images: long cache. `expires` emits Cache-Control itself — no add_header.
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Fonts (if ever self-hosted) cache like assets.
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
    }

    # CSS/JS: short cache so edits show up immediately.
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML: always revalidate — content edits must not be cached.
    # `expires epoch` emits Cache-Control: no-cache via nginx's own mechanism,
    # so the server-level security headers stay inherited (a location-level
    # add_header would silently drop them).
    location ~* \.html$ {
        expires epoch;
    }

    # Clean directory-style URLs: /about-veronica -> about-veronica.html
    location / {
        expires epoch;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Security headers (static site, no cookies, no forms).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml text/xml application/xml;
}
